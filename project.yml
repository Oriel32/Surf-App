# The Xcode project is GENERATED, never committed.
#
# A .xcodeproj is a merge-hostile binary-ish blob, and more to the point it can
# only be created on a Mac. Declaring the project here means the macOS CI runner
# builds it from source on every run, so the repo stays buildable from Windows
# and there is exactly one description of the app target.
#
#   xcodegen generate && xcodebuild -project Glassy.xcodeproj -scheme Glassy ...
name: Glassy
options:
  bundleIdPrefix: com.orieltech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SurfCore:
    path: SurfCore

targets:
  Glassy:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SurfCore
        product: SurfCore
    # Written outside App/ so the generated plist can never be swept back up as
    # a source file on the next generate.
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Glassy
        # Hebrew is the primary locale, not a translation of the English.
        CFBundleDevelopmentRegion: he
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orieltech.glassy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # claude.md: "Approachable Concurrency" and MainActor-by-default belong
        # to the app target. SurfCore stays a nonisolated library on purpose.
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # No signing identity anywhere in this repo or in CI. The build produces
        # an unsigned .ipa and SideStore signs it on-device with a free Apple ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
